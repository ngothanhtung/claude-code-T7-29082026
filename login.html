<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@700;800&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bgdark: "#090A14",
          primary: "#DF6B33",
        },
        fontFamily: {
          heading: ["Poppins", "sans-serif"],
          body: ["Inter", "sans-serif"],
        },
      },
    },
  };
</script>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
  body {
    font-family: "Inter", sans-serif;
  }
  .font-heading {
    font-family: "Poppins", sans-serif;
  }
  input:-webkit-autofill {
    -webkit-box-shadow: 0 0 0 1000px #12131f inset;
    -webkit-text-fill-color: #f5f5f5;
  }
</style>
</head>

<body class="bg-bgdark text-gray-200 min-h-screen flex items-center justify-center px-4 py-10 sm:px-6">

  <div class="w-full max-w-[420px]">

    <!-- Logo / Brand -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-primary/15 border border-primary/30 flex items-center justify-center mb-4">
        <i data-lucide="shield-check" class="w-6 h-6 text-primary"></i>
      </div>
      <h1 class="font-heading font-extrabold text-2xl sm:text-3xl text-white text-center">Welcome Back</h1>
      <p class="text-sm text-gray-400 mt-2 text-center">Sign in to continue to your account</p>
    </div>

    <!-- Card -->
    <div class="bg-[#0F1120] border border-white/5 rounded-2xl shadow-2xl shadow-black/40 p-6 sm:p-8">

      <form id="loginForm" class="space-y-5" novalidate>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
              <i data-lucide="mail" class="w-4.5 h-4.5"></i>
            </span>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
              class="w-full bg-[#12131f] border border-white/10 rounded-lg py-2.5 pl-10 pr-3 text-sm text-gray-100 placeholder-gray-500 outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
            />
          </div>
          <p id="emailError" class="hidden mt-1.5 text-xs text-red-400"></p>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
              <i data-lucide="lock" class="w-4.5 h-4.5"></i>
            </span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
              class="w-full bg-[#12131f] border border-white/10 rounded-lg py-2.5 pl-10 pr-10 text-sm text-gray-100 placeholder-gray-500 outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
            />
            <button
              type="button"
              id="togglePassword"
              aria-label="Toggle password visibility"
              class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-300 transition-colors"
            >
              <i data-lucide="eye" class="w-4.5 h-4.5"></i>
            </button>
          </div>
          <p id="passwordError" class="hidden mt-1.5 text-xs text-red-400"></p>
        </div>

        <!-- Remember me / Forgot password -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 cursor-pointer select-none text-gray-400">
            <input
              type="checkbox"
              class="w-4 h-4 rounded border-white/20 bg-[#12131f] text-primary focus:ring-primary focus:ring-offset-0 accent-primary"
            />
            Remember me
          </label>
          <a href="#" class="text-primary hover:text-primary/80 transition-colors font-medium">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full bg-primary hover:bg-primary/90 active:bg-primary/80 text-white font-semibold text-sm rounded-lg py-2.5 transition-colors flex items-center justify-center gap-2 shadow-lg shadow-primary/20"
        >
          Sign In
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

      </form>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-6">
        <div class="h-px flex-1 bg-white/10"></div>
        <span class="text-xs text-gray-500 whitespace-nowrap">Or continue with</span>
        <div class="h-px flex-1 bg-white/10"></div>
      </div>

      <!-- Social login -->
      <div class="grid grid-cols-3 gap-3">
        <button
          type="button"
          aria-label="Sign in with Google"
          class="flex items-center justify-center rounded-lg border border-white/10 bg-[#12131f] py-2.5 hover:bg-white/5 hover:border-white/20 transition-colors"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.3-1.66 3.8-5.5 3.8-3.31 0-6.02-2.74-6.02-6.1S8.69 5.7 12 5.7c1.89 0 3.16.8 3.88 1.49l2.64-2.55C16.9 3.06 14.7 2 12 2 6.98 2 2.9 6.03 2.9 11s4.08 9 9.1 9c5.25 0 8.74-3.69 8.74-8.89 0-.6-.07-1.06-.15-1.51H12z"/>
          </svg>
        </button>
        <button
          type="button"
          aria-label="Sign in with GitHub"
          class="flex items-center justify-center rounded-lg border border-white/10 bg-[#12131f] py-2.5 hover:bg-white/5 hover:border-white/20 transition-colors"
        >
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 .3a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.02c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.21.08 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.3 3.5 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.49 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .3Z"/>
          </svg>
        </button>
        <button
          type="button"
          aria-label="Sign in with Facebook"
          class="flex items-center justify-center rounded-lg border border-white/10 bg-[#12131f] py-2.5 hover:bg-white/5 hover:border-white/20 transition-colors"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07c0 6.02 4.39 11.02 10.13 11.93v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.96h-1.51c-1.49 0-1.95.93-1.95 1.89v2.26h3.32l-.53 3.49h-2.79v8.44C19.61 23.09 24 18.09 24 12.07Z"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- Footer -->
    <p class="text-center text-sm text-gray-500 mt-6">
      Don't have an account?
      <a href="register.html" class="text-primary hover:text-primary/80 font-medium transition-colors">Sign up</a>
    </p>

  </div>

  <script>
    lucide.createIcons();

    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.innerHTML = isPassword
        ? '<i data-lucide="eye-off" class="w-4.5 h-4.5"></i>'
        : '<i data-lucide="eye" class="w-4.5 h-4.5"></i>';
      lucide.createIcons();
    });

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");

    function setFieldError(input, errorEl, message) {
      if (message) {
        input.classList.add("border-red-500", "focus:border-red-500", "focus:ring-red-500");
        input.classList.remove("border-white/10", "focus:border-primary", "focus:ring-primary");
        errorEl.textContent = message;
        errorEl.classList.remove("hidden");
      } else {
        input.classList.remove("border-red-500", "focus:border-red-500", "focus:ring-red-500");
        input.classList.add("border-white/10", "focus:border-primary", "focus:ring-primary");
        errorEl.textContent = "";
        errorEl.classList.add("hidden");
      }
    }

    const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    function validateEmail() {
      if (emailInput.validity.valueMissing) {
        setFieldError(emailInput, emailError, "Email is required.");
        return false;
      }
      if (emailInput.validity.typeMismatch || !EMAIL_PATTERN.test(emailInput.value.trim())) {
        setFieldError(emailInput, emailError, "Please enter a valid email address (e.g. name@example.com).");
        return false;
      }
      setFieldError(emailInput, emailError, "");
      return true;
    }

    function validatePassword() {
      if (passwordInput.validity.valueMissing) {
        setFieldError(passwordInput, passwordError, "Password is required.");
        return false;
      }
      setFieldError(passwordInput, passwordError, "");
      return true;
    }

    emailInput.addEventListener("input", validateEmail);
    passwordInput.addEventListener("input", validatePassword);

    loginForm.addEventListener("submit", (e) => {
      const isEmailValid = validateEmail();
      const isPasswordValid = validatePassword();
      if (!isEmailValid || !isPasswordValid) {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
